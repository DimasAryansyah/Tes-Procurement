<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buat Purchase Request</title>
</head>
<body>
    <h1>Buat Purchase Request</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div>
            <label for="title">Judul Permintaan *</label><br>
            <input type="text" id="title" name="title" required>
        </div>

        <br>

        <div>
            <label for="description">Deskripsi Kebutuhan</label><br>
            <textarea id="description" name="description" rows="4"></textarea>
        </div>

        <br>

        <div>
            <label for="quantity">Jumlah *</label><br>
            <input type="number" id="quantity" name="quantity" min="1" required>
        </div>

        <br>

        <div>
            <label for="estimated_cost">Estimasi Biaya (Rp) *</label><br>
            <input
                type="number"
                id="estimated_cost"
                name="estimated_cost"
                min="0"
                step="0.01"
                required
            >
        </div>

        <br>

        
        <button type="submit" name="action" value="draft">
            Simpan Draft
        </button>
        <button type="submit" name="action" value="submit">
            Ajukan Request
        </button>
        <a href="{{ url_for('purchase_requests') }}">Batal</a>
    </form>
</body>
</html>
