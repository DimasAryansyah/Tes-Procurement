
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ 'Edit' if supplier else 'Tambah' }} Supplier</title>
</head>
<body>
    <h1>{{ 'Edit' if supplier else 'Tambah' }} Supplier</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endwith %}

    <form
        action="{{ url_for('edit_supplier', supplier_id=supplier.id) if supplier else url_for('add_supplier') }}"
        method="POST"
    >
        <div>
            <label for="name">Nama Supplier *</label><br>
            <input
                type="text"
                id="name"
                name="name"
                value="{{ supplier.name if supplier else '' }}"
                required
            >
        </div>

        <br>

        <div>
            <label for="contact_person">Contact Person</label><br>
            <input
                type="text"
                id="contact_person"
                name="contact_person"
                value="{{ supplier.contact_person or '' if supplier else '' }}"
            >
        </div>

        <br>

        <div>
            <label for="email">Email</label><br>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ supplier.email or '' if supplier else '' }}"
            >
        </div>

        <br>

        <div>
            <label for="phone">Nomor Telepon</label><br>
            <input
                type="text"
                id="phone"
                name="phone"
                value="{{ supplier.phone or '' if supplier else '' }}"
            >
        </div>

        <br>

        <div>
            <label for="address">Alamat</label><br>
            <textarea id="address" name="address" rows="3">{{ supplier.address or '' if supplier else '' }}</textarea>
        </div>

        <br>

        <button type="submit">
            {{ 'Simpan Perubahan' if supplier else 'Simpan Supplier' }}
        </button>

        <a href="{{ url_for('suppliers') }}">Batal</a>
    </form>
</body>
</html>
